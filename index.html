<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물류비 인사이트</title><link rel="stylesheet" href="style.css"></head>
<body><aside><a class="brand" href="#">▥ <span>물류비 인사이트<small>LOGISTICS INTELLIGENCE</small></span></a><div class="workspace">WORKSPACE <span>SCM</span></div><nav><button data-view="dashboard" class="active">▦ <span>대시보드</span></button><button data-view="entry">＋ <span>물류센터 비용 · 건수</span></button><button data-view="tradeEntry">⇄ <span>수출입 비용 입력</span></button><button data-view="tradeReport">▤ <span>수출입 건별 조회</span></button><button data-view="commonEntry">◇ <span>공통 비용 입력</span></button><button data-view="costs">▤ <span>비용 내역 · 업로드</span></button><button data-view="activity">▥ <span>물동량 · 매출</span></button><button data-view="notes">☷ <span>사유 · 조치 계획</span></button><button data-view="masters">⚙ <span>비용 항목 기준정보</span></button><button data-view="stores">⌂ <span>매장 마스터</span></button><button data-view="locations">◎ <span>국가 · 물류센터</span></button><button data-view="settings">⚙ <span>계정 · 백업 · 이력</span></button></nav><div class="side-bottom"><div class="avatar">L</div><div>물류 운영팀<small>독립 프로젝트 · 서버 DB 저장</small></div></div></aside>
<main><header><div class="breadcrumb">워크스페이스 <span>/</span> 물류비 관리</div><div class="user-toolbar"><span id="current-user"></span><button id="logout">로그아웃</button></div></header><section class="heading"><div><div class="eyebrow">COST OVERVIEW</div><h1 id="title">물류비 대시보드</h1><p>비용의 흐름을 파악하고, 더 나은 운영을 시작하세요.</p></div><div class="actions"><button id="export">↧ 보고서 다운로드</button><button class="primary" id="add">＋ 비용 등록</button></div></section>
<section class="filters"><div><label>비용유형<select id="domain"><option value="all">전체 유형</option><option value="center">물류센터</option><option value="trade">수출입</option><option value="common">공통</option></select></label><label>업무구분<select id="account"><option value="all">전체 업무</option><option>B2C</option><option>B2B</option><option>공통</option></select></label><label>조회 월<select id="month"></select></label><label>국가<select id="country"><option value="all">전체 국가</option></select></label><label>물류센터<select id="center"><option value="all">전체 센터</option></select></label><label>비용 항목<select id="category"><option value="all">전체 비용 항목</option></select></label><label>관리그룹 · 매장<select id="store"><option value="all">전체 관리그룹 · 매장</option></select></label></div><span>필터는 체크박스로 복수 선택 · 전체 선택 시 조건 해제<br>비용 합계는 건수 제외 · 출고 건수는 KPI에 자동 반영<br>집계 기준 <b>공급가액 기준</b></span></section>
<div id="content"></div><footer><span>ⓘ 건당 비용과 물류비율은 선택 범위의 출고량·매출로 계산됩니다.</span><span>서버 DB 저장 · 외부 AI 미연결</span></footer></main>
